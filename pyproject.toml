[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelo-calidad-web"
version = "0.1.0"
description = "Prototipo de apoyo para el modelo de evaluación automatizada de calidad web."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.scripts]
modelo-calidad-web = "modelo_calidad_web.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelo_calidad_web = ["catalogos/*.json"]

